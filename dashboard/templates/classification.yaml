version: 1
id: classification-cifar100
label: CIFAR-100 VGG 分类
summary: 使用仓库现有 VGG-16 + CIFAR-100 配置作为基础模板.
source_config: config/vgg_cifar100.yaml
fields:
  - path: runtime.experiment_name
    type: string
    label: 实验名称
    default: cifar100-vgg
  - path: trainer.max_epochs
    type: integer
    label: Epoch 数
    default: 10
    min: 1
    max: 10000
  - path: trainer.batch_size
    type: integer
    label: Batch size
    default: 128
    min: 1
    max: 4096
  - path: dataloader_defaults.num_workers
    type: integer
    label: DataLoader workers
    default: 4
    min: 0
    max: 64
  - path: optimization.optimizer.params.lr
    type: number
    label: Learning rate
    default: 0.001
    min: 0.00000001
    max: 10
  - path: optimization.optimizer.params.weight_decay
    type: number
    label: Weight decay
    default: 0.0001
    min: 0
    max: 10
  - path: runtime.data_dir
    type: data_directory
    label: 数据目录
    required: true
  - path: train_dataset.params.download
    type: boolean
    label: 缺失时下载 CIFAR-100
    default: false
