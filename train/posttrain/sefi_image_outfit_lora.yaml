# 使用示例:
# XDL_SEFI_IMAGE_CONFIG=train/posttrain/sefi_image_outfit_lora.yaml \
#   python train/posttrain/sefi_image_outfit_lora_finetune.py

experiment_name: sefi_image_outfit_lora
model_id: SeFi-Image/SeFi-Image-5B-Base
pipeline_class: diffusers.Flux2Pipeline
train_manifest: /root/autodl-tmp/data/sefi_image_outfit/train.jsonl
val_manifest: null
output_dir: /root/autodl-tmp/outputs/sefi_image_outfit_lora

training_prompt: outfit swap

image_height: 1536
image_width: 864
source_image_height: 1536
source_image_width: 864
batch_size: 1
num_workers: 4
dataset_repeat: 10
num_epochs: 100
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 1.0e-2
max_grad_norm: 1.0
device: cuda
model_dtype: auto

max_sequence_length: 512
text_encoder_out_layers: [10, 20, 30]
train_component: transformer
target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
  - add_q_proj
  - add_k_proj
  - add_v_proj
  - to_add_out
  - to_qkv_mlp_proj
  - proj_in
  - proj_out
lora_rank: 96
lora_alpha: 192
lora_dropout: 0.05
enable_gradient_checkpointing: true

weighting_scheme: none
logit_mean: 0.0
logit_std: 1.0
mode_scale: 1.29
save_every_n_epochs: 10
sample_every_n_epochs: 10
sample_steps: 20
sample_guidance: 4.0
sample_image_guidance: 1.6
sample_prompts:
  - outfit swap
sample_input_image: null
seed: 42
from_pretrained_kwargs: {}
