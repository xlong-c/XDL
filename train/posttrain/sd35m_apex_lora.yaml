model:
  model_path: stabilityai/stable-diffusion-3.5-medium
  imgs_dtype: bf16
  text_dtype: bf16
  max_sequence_length: 256
  vae_sample_mode: sample
  enable_lora: true
  enable_gradient_checkpointing: true

  # APEX 高阶一致性项会传入 tt.开启后脚本会给 SD3 transformer 补一个
  # 轻量的第二时间嵌入分支,便于 estimate_order >= 1 的 APEX 训练.
  aux_time_embed: true

  lora_rank: 64
  lora_alpha: 64
  lora_dropout: 0.0
  init_lora_weights: gaussian
  add_old_adapter: false
  lora_target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0
    - add_q_proj
    - add_k_proj
    - add_v_proj
    - ff.net.0.proj
    - ff.net.2
    - timestep_embedder.linear_1
    - timestep_embedder.linear_2

data:
  # image_txt: 每张图片旁边放同名 .txt,如 0001.png + 0001.txt
  # manifest: JSONL/JSON/CSV,字段 image + text/prompt/caption
  # apex_parquet: 复用 third_party/APEX/src/data/parquet_datasets.py
  format: image_txt
  height: 512
  width: 512
  center_crop: true
  random_flip: false
  datasets_repeat: 1
  train_dirs:
    - ./data/sd35_train
  # manifest_path: ./data/sd35_train.jsonl
  # cache_dir: ./others/cache/apex_parquet

method:
  method_type: APEX
  consistc_ratio: 1.0
  ema_decay_rate: 0.0
  enhanced_ratio: 0.5
  enhanced_range: [0.0, 1.0]
  time_dist_ctrl: [1.0, 1.0, 1.0]
  estimate_order: 1
  loss_func_type:
    type: barron_reweighting
    alpha: 1.0
  dist_match_cof: 0.5
  use_image_free: false

sample:
  enabled: false
  every_n_epochs: 1
  prompts:
    - a photo of a small wooden bench in a garden
  cfg_scale: 0.0
  cfg_interval: [0.0, 1.0]
  sampling_steps: 4
  stochast_ratio: 0.0
  extrapol_ratio: 0.0
  sampling_order: 1
  time_dist_ctrl: [1.0, 1.0, 1.0]
  rfba_gap_steps: [0.001, 0.0]
  sampling_style: mul
  return_traj: false

train:
  device: cuda
  output_dir: ./outputs/sd35m_apex_lora
  seed: 42
  allow_tf32: true
  mixed_precision: bf16

  # third_party/APEX 的 prepare_inputs 当前要求 batch size 至少为 4.
  micro_batch_size: 4
  grad_accumulation_steps: 1
  num_train_epochs: 1
  num_workers: 4
  drop_last: true

  optimizer: adamw
  lr: 1.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.0
  foreach: true
  max_grad_norm: 1.0

  save_every_n_epochs: 1
  save_every_n_train_steps:
  log_every_n_steps: 1
  enable_tqdm: true
  enable_console: false
  enable_tensorboard: false
