[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xdl-jax"
dynamic = ["version"]
description = "JAX-native training runtime for XDL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "XDL Contributors" }
]
keywords = ["jax", "flax", "optax", "deep-learning", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "jax>=0.11,<0.12",
    "flax>=0.12,<0.13",
    "optax>=0.2.8,<0.3",
    "orbax-checkpoint>=0.12,<0.13",
    "numpy>=2.1",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
cpu = ["jax[cpu]>=0.11,<0.12"]
gpu-cuda12 = ["jax[cuda12]>=0.11,<0.12"]
gpu-cuda13 = ["jax[cuda13]>=0.11,<0.12"]
test = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]
dev = [
    "build>=1.2",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/xlong-c/XDL"
Repository = "https://github.com/xlong-c/XDL/tree/master/xdl-jax"
Documentation = "https://github.com/xlong-c/XDL/tree/master/xdl-jax/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["xdl_jax*"]

[tool.setuptools.package-data]
xdl_jax = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "xdl_jax._version.__version__" }

[tool.pyright]
include = ["xdl_jax"]
exclude = ["tests", "examples"]
extraPaths = ["."]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "I"]
