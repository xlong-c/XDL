name: xdl-jax CI

on:
  push:
    paths:
      - "xdl-jax/**"
      - ".github/workflows/xdl-jax-ci.yml"
  pull_request:
    paths:
      - "xdl-jax/**"
      - ".github/workflows/xdl-jax-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xdl-jax/pyproject.toml
      - name: Install CPU development dependencies
        run: python -m pip install -e "./xdl-jax[cpu,dev]"
      - name: Check formatting and imports
        run: ruff check xdl-jax/xdl_jax xdl-jax/tests xdl-jax/examples
      - name: Check types
        run: pyright xdl-jax/xdl_jax
      - name: Run CPU tests
        env:
          JAX_PLATFORMS: cpu
          PYTHONPATH: xdl-jax
        run: python -m pytest xdl-jax/tests -q
      - name: Build wheel
        run: python -m build xdl-jax

