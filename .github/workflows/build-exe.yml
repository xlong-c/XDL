name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/image/batch_viewer.py'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
    
    - name: Build EXE
      run: |
        pyinstaller --name=BatchImageViewer --onefile --windowed tools/image/batch_viewer.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatchImageViewer-Windows
        path: dist/BatchImageViewer.exe
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/BatchImageViewer.exe
        tag_name: v${{ github.run_number }}
        name: Batch Image Viewer v${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
