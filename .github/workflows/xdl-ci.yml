name: XDL CI

on:
  push:
    paths:
      - "xdl/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/xdl-ci.yml"
  pull_request:
    paths:
      - "xdl/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/xdl-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install XDL development dependencies
        run: python -m pip install -e ".[dev,safetensors]"
      - name: Check formatting and imports
        run: ruff check xdl
      - name: Check types
        run: python -m pyright xdl
      - name: Run CPU tests
        run: >-
          python -m pytest
          tests/test_public_api.py
          tests/config
          tests/trainer
          tests/callbacks
          tests/utils
          tests/loss
          tests/metric
          tests/dataset
          tests/analysis
          tests/model
          tests/test_coremodel_logging.py
          tests/test_framework_fixes.py
          tests/test_trainer_device_transfer.py
          -q
