<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .section-title { font: 700 22px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1e293b; }
      .body { font: 500 16px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .small { font: 500 14px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .mono { font: 600 15px 'Courier New', monospace; fill: #7c2d12; }
      .chip { font: 700 14px 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .box { rx: 20; ry: 20; stroke-width: 2; }
      .inner { rx: 14; ry: 14; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>

  <text x="48" y="56" class="title">SGEMM 分层 Tiling：从全局矩阵一路缩小到寄存器微内核</text>
  <text x="48" y="88" class="subtitle">阅读重点：先看“每一层负责什么”，再看“数据如何从 global memory 逐层走到 register 并被反复复用”。</text>

  <!-- Section 1 -->
  <rect x="40" y="120" width="1520" height="220" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="90" cy="164" r="24" fill="#0f172a"/>
  <text x="82" y="171" style="font:700 18px Arial; fill:#ffffff;">1</text>
  <text x="130" y="170" class="section-title">全局问题：先明确这次 block 要解决哪一块输出</text>
  <text x="130" y="202" class="body">GEMM 的目标是 <tspan class="mono">C[M×N] = A[M×K] × B[K×N]</tspan>。高性能实现的关键不是“把公式写出来”，而是“把同一块数据尽量复用”。</text>

  <rect x="110" y="235" width="240" height="72" class="inner" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="132" y="265" class="label">A 矩阵</text>
  <text x="132" y="291" class="body">每次只取一块 A_sub = [BM × BK]</text>

  <rect x="420" y="235" width="240" height="72" class="inner" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="442" y="265" class="label">B 矩阵</text>
  <text x="442" y="291" class="body">每次只取一块 B_sub = [BK × BN]</text>

  <rect x="730" y="220" width="330" height="96" class="inner" fill="#dcfce7" stroke="#22c55e"/>
  <text x="752" y="258" class="label">一个 block 的目标</text>
  <text x="752" y="286" class="body">负责同一个 C_sub = [BM × BN]</text>
  <text x="752" y="310" class="small">注意：整个 K 方向由这个 block 自己循环完成</text>

  <path d="M350 271 L420 271" class="arrow"/>
  <path d="M660 271 L730 271" class="arrow"/>

  <rect x="1130" y="220" width="370" height="96" class="inner" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1154" y="258" class="label">第一层直觉</text>
  <text x="1154" y="286" class="body">复用来自两边：A 的行会被多个 n 复用，B 的列会被多个 m 复用。</text>
  <text x="1154" y="310" class="small">所以不能让每个线程都直接去 global memory 反复读。</text>

  <!-- Section 2 -->
  <rect x="40" y="370" width="1520" height="220" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="90" cy="414" r="24" fill="#0f172a"/>
  <text x="82" y="421" style="font:700 18px Arial; fill:#ffffff;">2</text>
  <text x="130" y="420" class="section-title">Block tile：把大问题拆成可复用的 A_sub / B_sub / C_sub</text>
  <text x="130" y="452" class="body">block 不会一次吃完整个 K，而是把 K 维分成很多个 <tspan class="mono">BK</tspan> 切片；每次加载一对 tile，然后更新同一个输出 tile。</text>

  <rect x="110" y="486" width="250" height="72" class="inner" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="132" y="516" class="label">A_sub at bk=i</text>
  <text x="132" y="542" class="body">尺寸 = BM × BK</text>

  <rect x="430" y="486" width="250" height="72" class="inner" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="452" y="516" class="label">B_sub at bk=i</text>
  <text x="452" y="542" class="body">尺寸 = BK × BN</text>

  <rect x="750" y="476" width="320" height="82" class="inner" fill="#dcfce7" stroke="#22c55e"/>
  <text x="772" y="512" class="label">更新同一个 C_sub</text>
  <text x="772" y="538" class="mono">C_sub += A_sub × B_sub</text>

  <path d="M360 522 L430 522" class="arrow"/>
  <path d="M680 522 L750 522" class="arrow"/>

  <rect x="1130" y="474" width="370" height="88" class="inner" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1154" y="508" class="label">K-slicing 伪代码</text>
  <text x="1154" y="534" class="mono">for (bk = 0; bk &lt; ceil(K/BK); ++bk)</text>
  <text x="1154" y="556" class="mono">  load A_sub / B_sub, then accumulate</text>

  <!-- Section 3 -->
  <rect x="40" y="620" width="1520" height="220" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="90" cy="664" r="24" fill="#0f172a"/>
  <text x="82" y="671" style="font:700 18px Arial; fill:#ffffff;">3</text>
  <text x="130" y="670" class="section-title">Thread tile：再把一个 C_sub 继续切小，让每个线程负责一个 TM × TN 输出块</text>
  <text x="130" y="702" class="body">如果一个线程只算一个标量，shared memory 和寄存器里的数据复用仍然偏低；所以高性能 GEMM 往往让一个线程算一小块矩形。</text>

  <rect x="110" y="736" width="420" height="80" class="inner" fill="#eef2ff" stroke="#6366f1"/>
  <text x="132" y="766" class="label">一个 block 负责的 C_sub</text>
  <text x="132" y="792" class="body">它会继续被切成 many TM × TN 的 thread tile</text>

  <g transform="translate(610,724)">
    <rect x="0" y="0" width="320" height="96" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12" ry="12"/>
    <g>
      <line x1="40" y1="0" x2="40" y2="96" class="grid"/>
      <line x1="80" y1="0" x2="80" y2="96" class="grid"/>
      <line x1="120" y1="0" x2="120" y2="96" class="grid"/>
      <line x1="160" y1="0" x2="160" y2="96" class="grid"/>
      <line x1="200" y1="0" x2="200" y2="96" class="grid"/>
      <line x1="240" y1="0" x2="240" y2="96" class="grid"/>
      <line x1="280" y1="0" x2="280" y2="96" class="grid"/>
      <line x1="0" y1="24" x2="320" y2="24" class="grid"/>
      <line x1="0" y1="48" x2="320" y2="48" class="grid"/>
      <line x1="0" y1="72" x2="320" y2="72" class="grid"/>
    </g>
    <rect x="120" y="48" width="80" height="24" fill="#fecaca" stroke="#ef4444" stroke-width="2" rx="8" ry="8"/>
    <text x="16" y="120" class="small">红色块 = 一个线程负责的 TM × TN</text>
  </g>

  <path d="M530 776 L610 776" class="arrow"/>

  <rect x="1010" y="736" width="490" height="80" class="inner" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1034" y="766" class="label">线程数量关系</text>
  <text x="1034" y="792" class="mono">threads = (BM / TM) × (BN / TN)</text>
  <text x="1034" y="814" class="small">同时也决定了 block 维度、寄存器压力和 occupancy。</text>

  <!-- Section 4 -->
  <rect x="40" y="870" width="1520" height="220" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="90" cy="914" r="24" fill="#0f172a"/>
  <text x="82" y="921" style="font:700 18px Arial; fill:#ffffff;">4</text>
  <text x="130" y="920" class="section-title">寄存器微内核：每个 tk 做一次外积更新，最终得到 r_c[TM][TN]</text>
  <text x="130" y="952" class="body">在一个固定的 bk 内，线程会不断从 shared memory 取出 A/B 的小片段，放进寄存器，然后用外积方式更新累加器。</text>

  <rect x="130" y="992" width="130" height="64" class="inner" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="154" y="1020" class="label">fragA[TM]</text>
  <text x="154" y="1044" class="small">来自 A_sub(:, tk)</text>

  <rect x="330" y="992" width="150" height="64" class="inner" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="354" y="1020" class="label">fragB[TN]</text>
  <text x="354" y="1044" class="small">来自 B_sub(tk, :)</text>

  <path d="M260 1024 L330 1024" class="arrow"/>
  <path d="M480 1024 L560 1024" class="arrow"/>

  <rect x="560" y="976" width="270" height="92" class="inner" fill="#fee2e2" stroke="#ef4444"/>
  <text x="584" y="1012" class="label">acc = r_c[TM][TN]</text>
  <text x="584" y="1038" class="mono">acc[tm][tn] += fragA[tm] * fragB[tn]</text>
  <text x="584" y="1062" class="small">这就是 GEMM 内层最核心的计算单元</text>

  <rect x="910" y="972" width="590" height="96" class="inner" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="934" y="1004" class="label">一个 bk 内的典型循环</text>
  <text x="934" y="1030" class="mono">for (tk = 0; tk &lt; BK; ++tk) { load fragA; load fragB; acc += outer_product; }</text>
  <text x="934" y="1056" class="small">当 TM=TN=8 时，每个 tk 会更新 64 个输出元素；BK 次 tk 累加后得到这个线程的完整输出块。</text>
</svg>
