<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">TileLang grid for ROSA</title>
  <desc id="desc">The teaching kernel maps one flattened row and one time index to one CUDA program.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .title { fill: #0f172a; font: 800 24px system-ui, sans-serif; }
      .label { fill: #475569; font: 750 16px system-ui, sans-serif; }
      .small { fill: #64748b; font: 600 13px system-ui, sans-serif; }
      .cell { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; rx: 5; }
      .active { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2; }
      .inner { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 7; }
      .warn { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 7; }
      .txt { fill: #0f172a; font: 800 16px ui-monospace, monospace; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="bg" width="1040" height="420"/>
  <rect class="panel" x="28" y="24" width="984" height="372"/>
  <text class="title" x="56" y="64">TileLang teaching kernel: one program per (row, time)</text>
  <text class="small" x="56" y="92">Flatten [B, C, T] or [B, groups, T] into [rows, T]. Grid x is row. Grid y is time t.</text>

  <text class="label" x="78" y="138">program grid</text>
  <g transform="translate(78 158)">
    <rect class="cell" x="0" y="0" width="58" height="38"/><text class="txt" x="18" y="25">0,0</text>
    <rect class="cell" x="66" y="0" width="58" height="38"/><text class="txt" x="84" y="25">0,1</text>
    <rect class="cell" x="132" y="0" width="58" height="38"/><text class="txt" x="150" y="25">0,2</text>
    <rect class="cell" x="198" y="0" width="58" height="38"/><text class="txt" x="216" y="25">0,3</text>
    <rect class="cell" x="0" y="48" width="58" height="38"/><text class="txt" x="18" y="73">1,0</text>
    <rect class="active" x="66" y="48" width="58" height="38"/><text class="txt" x="84" y="73">1,1</text>
    <rect class="cell" x="132" y="48" width="58" height="38"/><text class="txt" x="150" y="73">1,2</text>
    <rect class="cell" x="198" y="48" width="58" height="38"/><text class="txt" x="216" y="73">1,3</text>
    <rect class="cell" x="0" y="96" width="58" height="38"/><text class="txt" x="18" y="121">2,0</text>
    <rect class="cell" x="66" y="96" width="58" height="38"/><text class="txt" x="84" y="121">2,1</text>
    <rect class="cell" x="132" y="96" width="58" height="38"/><text class="txt" x="150" y="121">2,2</text>
    <rect class="cell" x="198" y="96" width="58" height="38"/><text class="txt" x="216" y="121">2,3</text>
  </g>

  <path class="arrow" d="M 380 226 L 480 226"/>

  <rect class="inner" x="512" y="132" width="200" height="92"/>
  <text class="label" x="540" y="164">inside one program</text>
  <text class="small" x="540" y="190">scan suffix starts</text>
  <text class="small" x="540" y="210">scan history starts</text>

  <rect class="warn" x="512" y="250" width="390" height="88"/>
  <text class="label" x="540" y="282">teaching tradeoff</text>
  <text class="small" x="540" y="308">This brute-force version is easy to verify. Production ROSA should replace the inner scans with suffix automaton state.</text>
</svg>
