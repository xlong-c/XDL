<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">4-bit symbol packing</title>
  <desc id="desc">Four sign bits from channels are packed into one uint8 symbol before ROSA suffix matching.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .title { fill: #0f172a; font: 800 24px system-ui, sans-serif; }
      .label { fill: #475569; font: 750 16px system-ui, sans-serif; }
      .small { fill: #64748b; font: 600 13px system-ui, sans-serif; }
      .bit0 { fill: #fee2e2; stroke: #be123c; }
      .bit1 { fill: #dcfce7; stroke: #047857; }
      .sym { fill: #dbeafe; stroke: #2563eb; }
      .out { fill: #fef3c7; stroke: #b45309; }
      .box { stroke-width: 2; rx: 7; }
      .txt { fill: #0f172a; font: 800 18px ui-monospace, monospace; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="bg" width="1040" height="360"/>
  <rect class="panel" x="28" y="24" width="984" height="312"/>
  <text class="title" x="56" y="64">ROSA 4-bit path: channels -> bits -> symbol -> matched symbol -> channels</text>
  <text class="small" x="56" y="92">Each group of four sign channels becomes one discrete symbol. Example bits [0, 1, 0, 1] become binary 1010 = decimal 10.</text>

  <text class="label" x="72" y="146">channel signs</text>
  <g transform="translate(72 166)">
    <rect class="box bit0" x="0" y="0" width="70" height="50"/><text class="txt" x="27" y="32">-</text>
    <rect class="box bit1" x="82" y="0" width="70" height="50"/><text class="txt" x="109" y="32">+</text>
    <rect class="box bit0" x="164" y="0" width="70" height="50"/><text class="txt" x="191" y="32">-</text>
    <rect class="box bit1" x="246" y="0" width="70" height="50"/><text class="txt" x="273" y="32">+</text>
  </g>
  <text class="small" x="95" y="244">sign(x) > 0 gives bits [0, 1, 0, 1]</text>

  <path class="arrow" d="M 420 190 L 520 190"/>
  <rect class="box sym" x="548" y="152" width="170" height="76"/>
  <text class="txt" x="590" y="184">1010</text>
  <text class="label" x="594" y="210">symbol 10</text>

  <path class="arrow" d="M 742 190 L 838 190"/>
  <rect class="box out" x="864" y="152" width="100" height="76"/>
  <text class="txt" x="897" y="184">v</text>
  <text class="label" x="884" y="210">hit</text>
  <text class="small" x="572" y="270">TileLang sees [rows, T] uint8 symbols. PyTorch unpacks the matched symbol back to channels.</text>
</svg>
