<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">ROSA suffix match</title>
  <desc id="desc">A query suffix is matched against historical key symbols, then the successor value is emitted.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .title { fill: #0f172a; font: 800 24px system-ui, sans-serif; }
      .label { fill: #475569; font: 700 16px system-ui, sans-serif; }
      .small { fill: #64748b; font: 600 13px system-ui, sans-serif; }
      .cell { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .hit { fill: #ccfbf1; stroke: #0f766e; }
      .suffix { fill: #dbeafe; stroke: #2563eb; }
      .value { fill: #fef3c7; stroke: #b45309; }
      .txt { fill: #0f172a; font: 800 18px ui-monospace, monospace; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .blue-arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1040" height="420"/>
  <rect class="panel" x="28" y="24" width="984" height="372"/>
  <text class="title" x="56" y="64">ROSA: longest suffix -> history match -> successor value</text>
  <text class="small" x="56" y="92">At time t, query suffix q[s:t] is compared with key history k[0:t-1]. The matched history end j emits v[j+1].</text>

  <text class="label" x="78" y="146">query q[0:t]</text>
  <g transform="translate(78 166)">
    <rect class="cell" x="0" y="0" width="54" height="44"/><text class="txt" x="20" y="29">1</text>
    <rect class="cell" x="62" y="0" width="54" height="44"/><text class="txt" x="82" y="29">0</text>
    <rect class="suffix" x="124" y="0" width="54" height="44"/><text class="txt" x="144" y="29">1</text>
    <rect class="suffix" x="186" y="0" width="54" height="44"/><text class="txt" x="206" y="29">0</text>
    <rect class="suffix" x="248" y="0" width="54" height="44"/><text class="txt" x="268" y="29">1</text>
  </g>
  <text class="small" x="210" y="234">current suffix = [1, 0, 1]</text>

  <path class="blue-arrow" d="M 370 188 C 450 130, 520 130, 604 188"/>

  <text class="label" x="586" y="146">key history k[0:t-1]</text>
  <g transform="translate(586 166)">
    <rect class="cell" x="0" y="0" width="54" height="44"/><text class="txt" x="20" y="29">1</text>
    <rect class="cell" x="62" y="0" width="54" height="44"/><text class="txt" x="82" y="29">1</text>
    <rect class="hit" x="124" y="0" width="54" height="44"/><text class="txt" x="144" y="29">1</text>
    <rect class="hit" x="186" y="0" width="54" height="44"/><text class="txt" x="206" y="29">0</text>
    <rect class="hit" x="248" y="0" width="54" height="44"/><text class="txt" x="268" y="29">1</text>
  </g>
  <text class="small" x="710" y="234">latest longest match ends at j</text>

  <path class="arrow" d="M 806 240 C 810 290, 758 310, 700 322"/>

  <text class="label" x="78" y="316">value stream v</text>
  <g transform="translate(206 292)">
    <rect class="cell" x="0" y="0" width="54" height="44"/><text class="txt" x="20" y="29">0</text>
    <rect class="cell" x="62" y="0" width="54" height="44"/><text class="txt" x="82" y="29">1</text>
    <rect class="cell" x="124" y="0" width="54" height="44"/><text class="txt" x="144" y="29">0</text>
    <rect class="cell" x="186" y="0" width="54" height="44"/><text class="txt" x="206" y="29">1</text>
    <rect class="cell" x="248" y="0" width="54" height="44"/><text class="txt" x="268" y="29">1</text>
    <rect class="value" x="310" y="0" width="54" height="44"/><text class="txt" x="330" y="29">0</text>
  </g>
  <text class="label" x="650" y="322">emit v[j+1]</text>
  <text class="small" x="650" y="348">No attention matrix is built. This is symbolic memory retrieval.</text>
</svg>
