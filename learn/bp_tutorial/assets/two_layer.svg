<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">两层网络 (单神经元) 前向 + 反向</text>

  <!-- Input -->
  <circle cx="60" cy="120" r="28" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="60" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">x</text>

  <!-- Layer 1: z1 -->
  <rect x="140" y="105" width="70" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="175" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="bold">z₁=w₁x</text>

  <!-- Layer 1: a1 -->
  <rect x="240" y="105" width="70" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="275" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="bold">a₁=σ(z₁)</text>

  <!-- Layer 2: z2 -->
  <rect x="340" y="105" width="70" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="375" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="bold">z₂=w₂a₁</text>

  <!-- Layer 2: a2 -->
  <rect x="440" y="105" width="70" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="475" y="125" text-anchor="middle" fill="white" font-size="12" font-weight="bold">a₂=σ(z₂)</text>

  <!-- Arrows forward -->
  <line x1="88" y1="120" x2="140" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="120" x2="240" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="120" x2="340" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="120" x2="440" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loss -->
  <circle cx="560" cy="120" r="28" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">L</text>
  <line x1="510" y1="120" x2="532" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Values -->
  <text x="60" y="170" text-anchor="middle" font-size="11" fill="#666">x=2</text>
  <text x="175" y="155" text-anchor="middle" font-size="11" fill="#666">z₁=1.0</text>
  <text x="275" y="155" text-anchor="middle" font-size="11" fill="#666">a₁=0.731</text>
  <text x="375" y="155" text-anchor="middle" font-size="11" fill="#666">z₂=0.585</text>
  <text x="475" y="155" text-anchor="middle" font-size="11" fill="#666">a₂=0.642</text>
  <text x="560" y="170" text-anchor="middle" font-size="11" fill="#666">L=0.129</text>

  <!-- Backward pass -->
  <text x="300" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">反向传播 (链式法则)</text>

  <!-- Backward arrows -->
  <line x1="532" y1="260" x2="510" y2="260" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="440" y1="260" x2="410" y2="260" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="340" y1="260" x2="310" y2="260" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="240" y1="260" x2="210" y2="260" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="140" y1="260" x2="88" y2="260" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>

  <!-- Backward labels -->
  <text x="525" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">∂L/∂a₂</text>
  <text x="475" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">∂L/∂z₂</text>
  <text x="375" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">∂L/∂a₁</text>
  <text x="275" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">∂L/∂z₁</text>
  <text x="175" y="255" text-anchor="middle" font-size="10" fill="#e74c3c">∂L/∂w₁</text>

  <!-- Key insight box -->
  <rect x="50" y="290" width="500" height="80" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="300" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">关键：为什么需要存储 a₁?</text>
  <text x="100" y="340" font-size="12" fill="#333">求 ∂L/∂w₂ 时: ∂L/∂w₂ = (a₂-y) · a₂(1-a₂) · a₁  ← 需要 a₁!</text>
  <text x="100" y="360" font-size="12" fill="#333">求 ∂L/∂w₁ 时: ∂L/∂w₁ = ... · w₂ · a₁(1-a₁) · x  ← 又需要 a₁!</text>
</svg>
