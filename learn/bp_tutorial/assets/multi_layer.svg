<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">多层网络 (L 层) 前向 + 反向</text>

  <!-- Input -->
  <circle cx="50" cy="120" r="28" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="50" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">x</text>

  <!-- Layer 1 -->
  <rect x="110" y="105" width="60" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">z₁</text>
  <rect x="180" y="105" width="60" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="210" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">a₁</text>

  <!-- Dots -->
  <text x="280" y="125" text-anchor="middle" font-size="24" fill="#999">···</text>

  <!-- Layer l-1 -->
  <rect x="330" y="105" width="60" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="360" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">z_{l-1}</text>
  <rect x="400" y="105" width="60" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="430" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">a_{l-1}</text>

  <!-- Layer l -->
  <rect x="470" y="105" width="60" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="500" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">z_l</text>
  <rect x="540" y="105" width="60" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="570" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">a_l</text>

  <!-- Loss -->
  <circle cx="650" cy="120" r="28" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="650" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">L</text>

  <!-- Forward arrows -->
  <line x1="78" y1="120" x2="110" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="120" x2="180" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="120" x2="260" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="330" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="120" x2="400" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="120" x2="470" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="120" x2="540" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="120" x2="622" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Forward label -->
  <text x="350" y="85" text-anchor="middle" font-size="13" fill="#27ae60">前向: x → z₁ → a₁ → ··· → z_l → a_l → L</text>

  <!-- Backward arrows -->
  <line x1="622" y1="180" x2="600" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="540" y1="180" x2="530" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="470" y1="180" x2="460" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="400" y1="180" x2="390" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="330" y1="180" x2="300" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="260" y1="180" x2="240" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="180" y1="180" x2="170" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="110" y1="180" x2="78" y2="180" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>

  <!-- Backward label -->
  <text x="350" y="210" text-anchor="middle" font-size="13" fill="#e74c3c">反向: ∂L/∂a_l → ∂L/∂z_l → ··· → ∂L/∂a₁ → ∂L/∂z₁ → ∂L/∂x</text>

  <!-- General formula box -->
  <rect x="50" y="235" width="600" height="170" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="350" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">通用公式 (第 l 层)</text>

  <!-- Forward formula -->
  <text x="100" y="290" font-size="13" fill="#27ae60">前向:</text>
  <text x="170" y="290" font-size="13" fill="#333">z_l = W_l · a_{l-1} + b_l</text>
  <text x="170" y="310" font-size="13" fill="#333">a_l = σ(z_l)</text>

  <!-- Backward formula -->
  <text x="100" y="345" font-size="13" fill="#e74c3c">反向:</text>
  <text x="170" y="345" font-size="13" fill="#333">δ_l = (W_{l+1}^T · δ_{l+1}) ⊙ σ'(z_l)  ← 需要 z_l (前向存的)</text>
  <text x="170" y="365" font-size="13" fill="#333">∂L/∂W_l = δ_l · a_{l-1}^T            ← 需要 a_{l-1} (前向存的)</text>
  <text x="170" y="385" font-size="13" fill="#333">∂L/∂b_l = δ_l</text>

  <!-- Key insight -->
  <text x="350" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">每层必须存: z_l 和 a_{l-1}，否则反向无法计算梯度!</text>
</svg>
