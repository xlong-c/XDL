<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">y = wx 前向传播</text>

  <!-- Input node -->
  <circle cx="80" cy="120" r="30" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="125" text-anchor="middle" fill="white" font-size="16" font-weight="bold">x</text>

  <!-- Weight node -->
  <rect x="200" y="105" width="60" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="230" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">w</text>

  <!-- Output node -->
  <circle cx="380" cy="120" r="30" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ŷ</text>

  <!-- Forward arrows -->
  <line x1="110" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="120" x2="350" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Forward labels -->
  <text x="155" y="110" text-anchor="middle" font-size="12" fill="#555">输入</text>
  <text x="305" y="110" text-anchor="middle" font-size="12" fill="#555">ŷ = w·x</text>

  <!-- Example values -->
  <text x="80" y="175" text-anchor="middle" font-size="13" fill="#666">x = 3</text>
  <text x="230" y="155" text-anchor="middle" font-size="13" fill="#666">w = 2</text>
  <text x="380" y="175" text-anchor="middle" font-size="13" fill="#666">ŷ = 6</text>

  <!-- Backward pass (red) -->
  <text x="250" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">反向传播（红色箭头）</text>

  <!-- Backward arrows -->
  <line x1="350" y1="250" x2="260" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>
  <line x1="200" y1="250" x2="110" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,3"/>

  <!-- Backward labels -->
  <text x="305" y="245" text-anchor="middle" font-size="11" fill="#e74c3c">∂L/∂ŷ · x</text>
  <text x="155" y="245" text-anchor="middle" font-size="11" fill="#e74c3c">∂L/∂w = (ŷ-y)·x</text>
</svg>
