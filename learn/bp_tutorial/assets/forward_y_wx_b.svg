<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">y = wx + b 前向传播</text>

  <!-- Input node -->
  <circle cx="80" cy="100" r="30" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="bold">x</text>

  <!-- Weight node -->
  <rect x="200" y="85" width="60" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="230" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="bold">w</text>

  <!-- Multiply symbol -->
  <text x="175" y="105" text-anchor="middle" font-size="18" fill="#555">×</text>

  <!-- Bias node -->
  <circle cx="230" cy="180" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="230" y="185" text-anchor="middle" fill="white" font-size="14" font-weight="bold">b</text>

  <!-- Add symbol -->
  <text x="260" y="145" text-anchor="middle" font-size="18" fill="#555">+</text>

  <!-- Output node -->
  <circle cx="380" cy="120" r="30" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ŷ</text>

  <!-- Forward arrows -->
  <line x1="110" y1="100" x2="165" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="100" x2="350" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="155" x2="250" y2="140" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Values -->
  <text x="80" y="155" text-anchor="middle" font-size="13" fill="#666">x = 3</text>
  <text x="230" y="75" text-anchor="middle" font-size="13" fill="#666">w = 2</text>
  <text x="230" y="220" text-anchor="middle" font-size="13" fill="#666">b = 1</text>
  <text x="380" y="175" text-anchor="middle" font-size="13" fill="#666">ŷ = 2×3 + 1 = 7</text>

  <!-- Gradient annotations -->
  <text x="250" y="260" text-anchor="middle" font-size="13" fill="#e74c3c">反向: ∂L/∂w = (ŷ-y)·x  |  ∂L/∂b = (ŷ-y)  |  ∂L/∂x = (ŷ-y)·w</text>
</svg>
