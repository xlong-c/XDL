<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">单个神经元 (带激活函数)</text>

  <!-- Input -->
  <circle cx="60" cy="120" r="28" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="60" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">x</text>

  <!-- Linear: z = wx + b -->
  <rect x="150" y="105" width="80" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="190" y="125" text-anchor="middle" fill="white" font-size="13" font-weight="bold">z=wx+b</text>

  <line x1="88" y1="120" x2="150" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activation: a = σ(z) -->
  <rect x="280" y="105" width="80" height="30" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="320" y="125" text-anchor="middle" fill="white" font-size="13" font-weight="bold">a=σ(z)</text>

  <line x1="230" y1="120" x2="280" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <circle cx="420" cy="120" r="28" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">a</text>

  <line x1="360" y1="120" x2="392" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Values row -->
  <text x="60" y="175" text-anchor="middle" font-size="12" fill="#666">x=2</text>
  <text x="190" y="155" text-anchor="middle" font-size="12" fill="#666">z=1.0</text>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#666">σ(1.0)=0.731</text>
  <text x="420" y="175" text-anchor="middle" font-size="12" fill="#666">a=0.731</text>

  <!-- What to store -->
  <rect x="50" y="195" width="400" height="100" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="250" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">前向必须存储的中间值</text>
  <text x="120" y="245" font-size="12" fill="#333">• x = 2          (用于计算 ∂L/∂w)</text>
  <text x="120" y="265" font-size="12" fill="#333">• z = 1.0        (用于计算 σ'(z) = a·(1-a))</text>
  <text x="120" y="285" font-size="12" fill="#333">• a = 0.731      (用于计算下一层输入)</text>
</svg>
