<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Naive Softmax 与 Safe Softmax 对比</title>
  <desc id="desc">左侧展示大 logits 直接 exp 会溢出, 右侧展示减去 row max 后指数项不超过 1, softmax 输出保持稳定.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">Softmax 稳定性的核心: 先减 row max</text>
  <text x="560" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">减去同一个常数不会改变 softmax, 但会把最大指数项限制为 exp(0)=1</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="64" y="126" width="464" height="360" rx="18" fill="#111827" stroke="#fb7185" stroke-opacity="0.55"/>
    <rect x="592" y="126" width="464" height="360" rx="18" fill="#10251f" stroke="#2dd4bf" stroke-opacity="0.65"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="296" y="170" text-anchor="middle" fill="#fecdd3" font-size="22" font-weight="800">Naive</text>
    <text x="296" y="196" text-anchor="middle" fill="#fda4af" font-size="14">直接计算 exp([1000,1001,1002])</text>
    <line x1="130" y1="382" x2="462" y2="382" stroke="#64748b" stroke-width="2"/>
    <line x1="130" y1="236" x2="130" y2="382" stroke="#64748b" stroke-width="2"/>
    <rect x="180" y="318" width="54" height="64" rx="8" fill="url(#red)"/>
    <rect x="270" y="294" width="54" height="88" rx="8" fill="url(#red)"/>
    <rect x="360" y="250" width="54" height="132" rx="8" fill="url(#red)"/>
    <text x="207" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">1000</text>
    <text x="297" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">1001</text>
    <text x="387" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">1002</text>
    <path d="M244 250H348" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text x="296" y="232" text-anchor="middle" fill="#fecdd3" font-size="15" font-weight="800">exp(x) overflow</text>
    <rect x="160" y="430" width="272" height="34" rx="8" fill="#3b1020" stroke="#fb7185"/>
    <text x="296" y="452" text-anchor="middle" fill="#ffe4e6" font-size="15" font-weight="800">输出可能变成 inf / NaN</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="824" y="170" text-anchor="middle" fill="#ccfbf1" font-size="22" font-weight="800">Safe</text>
    <text x="824" y="196" text-anchor="middle" fill="#99f6e4" font-size="14">先减 m=max(row)=1002</text>
    <line x1="658" y1="382" x2="990" y2="382" stroke="#64748b" stroke-width="2"/>
    <line x1="658" y1="236" x2="658" y2="382" stroke="#64748b" stroke-width="2"/>
    <rect x="708" y="352" width="54" height="30" rx="8" fill="url(#green)"/>
    <rect x="798" y="326" width="54" height="56" rx="8" fill="url(#green)"/>
    <rect x="888" y="280" width="54" height="102" rx="8" fill="url(#green)"/>
    <text x="735" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">-2</text>
    <text x="825" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">-1</text>
    <text x="915" y="407" text-anchor="middle" fill="#e5e7eb" font-size="13">0</text>
    <path d="M760 250H876" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="824" y="232" text-anchor="middle" fill="#ccfbf1" font-size="15" font-weight="800">exp(x-m) &lt;= 1</text>
    <rect x="686" y="430" width="276" height="34" rx="8" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="824" y="452" text-anchor="middle" fill="#d1fae5" font-size="15" font-weight="800">输出稳定: [0.09, 0.24, 0.67]</text>
  </g>

  <text x="560" y="526" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="14">FlashAttention 后续所有 online 更新都基于这个不变量: 改变坐标系, 不改变 softmax 结果.</text>
</svg>
