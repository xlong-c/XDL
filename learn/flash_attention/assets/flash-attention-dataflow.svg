<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Baseline Attention 与 FlashAttention 数据流对比</title>
  <desc id="desc">左侧展示 baseline attention 把 S 和 P 两个 N x N 矩阵写入 HBM, 右侧展示 FlashAttention 在片上维护 m, l, acc 状态并只写出 O block.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="54%" stop-color="#102235"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" x2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-hot" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cool" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <g opacity="0.2" stroke="#94a3b8" stroke-width="1">
    <path d="M0 96H1200M0 192H1200M0 288H1200M0 384H1200M0 480H1200M0 576H1200"/>
    <path d="M120 0V680M240 0V680M360 0V680M480 0V680M600 0V680M720 0V680M840 0V680M960 0V680M1080 0V680"/>
  </g>

  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">同一个 Attention, 两种执行顺序</text>
  <text x="600" y="88" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">Baseline 把 N x N 中间矩阵落到 HBM; FlashAttention 把分块 softmax 状态留在片上</text>

  <g filter="url(#shadow)">
    <rect x="48" y="124" width="520" height="492" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="632" y="124" width="520" height="492" rx="18" fill="#0f1f2e" stroke="#2dd4bf" stroke-opacity="0.5"/>
  </g>

  <text x="308" y="166" text-anchor="middle" fill="#fb7185" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Baseline Attention</text>
  <text x="892" y="166" text-anchor="middle" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">FlashAttention</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="210" width="120" height="74" rx="10" fill="#172554" stroke="#60a5fa"/>
    <text x="152" y="240" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="700">Q</text>
    <text x="152" y="264" text-anchor="middle" fill="#93c5fd" font-size="13">N x d</text>

    <rect x="260" y="210" width="120" height="74" rx="10" fill="#164e63" stroke="#22d3ee"/>
    <text x="320" y="240" text-anchor="middle" fill="#cffafe" font-size="18" font-weight="700">K</text>
    <text x="320" y="264" text-anchor="middle" fill="#67e8f9" font-size="13">N x d</text>

    <path d="M214 247H256" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-hot)"/>
    <rect x="146" y="332" width="186" height="120" rx="12" fill="#3b1020" stroke="#fb7185"/>
    <text x="239" y="370" text-anchor="middle" fill="#ffe4e6" font-size="18" font-weight="800">S = QK^T</text>
    <text x="239" y="398" text-anchor="middle" fill="#fecdd3" font-size="16">N x N</text>
    <text x="239" y="424" text-anchor="middle" fill="#fda4af" font-size="13">写入 HBM</text>

    <path d="M239 456V494" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-hot)"/>
    <rect x="146" y="500" width="186" height="72" rx="12" fill="#3b1020" stroke="#fb7185"/>
    <text x="239" y="530" text-anchor="middle" fill="#ffe4e6" font-size="17" font-weight="800">P = softmax(S)</text>
    <text x="239" y="554" text-anchor="middle" fill="#fda4af" font-size="13">再写一个 N x N</text>

    <rect x="382" y="500" width="118" height="72" rx="12" fill="#312e81" stroke="#a78bfa"/>
    <text x="441" y="531" text-anchor="middle" fill="#ede9fe" font-size="18" font-weight="800">V</text>
    <text x="441" y="554" text-anchor="middle" fill="#c4b5fd" font-size="13">N x d</text>
    <path d="M334 536H378" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-hot)"/>
    <path d="M442 496V455H355" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-hot)" fill="none"/>

    <rect x="360" y="332" width="150" height="120" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="435" y="373" text-anchor="middle" fill="#d1fae5" font-size="18" font-weight="800">O = P V</text>
    <text x="435" y="401" text-anchor="middle" fill="#a7f3d0" font-size="16">N x d</text>
    <text x="435" y="426" text-anchor="middle" fill="#6ee7b7" font-size="13">最终输出</text>

    <rect x="92" y="596" width="420" height="1" fill="#475569"/>
    <text x="302" y="628" text-anchor="middle" fill="#fda4af" font-size="14" font-weight="700">瓶颈: S 和 P 的 HBM 读写随 N^2 增长</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="676" y="210" width="134" height="86" rx="10" fill="#172554" stroke="#60a5fa"/>
    <text x="743" y="242" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="800">Q block</text>
    <text x="743" y="268" text-anchor="middle" fill="#93c5fd" font-size="13">BLOCK_M x d</text>

    <g transform="translate(860 202)">
      <rect width="216" height="112" rx="12" fill="#082f49" stroke="#22d3ee"/>
      <text x="108" y="30" text-anchor="middle" fill="#cffafe" font-size="17" font-weight="800">K,V blocks</text>
      <text x="108" y="53" text-anchor="middle" fill="#67e8f9" font-size="13">循环扫描完整序列</text>
      <rect x="28" y="70" width="34" height="22" rx="5" fill="#155e75"/>
      <rect x="68" y="70" width="34" height="22" rx="5" fill="#155e75"/>
      <rect x="108" y="70" width="34" height="22" rx="5" fill="#155e75"/>
      <rect x="148" y="70" width="34" height="22" rx="5" fill="#155e75"/>
    </g>

    <path d="M812 254H854" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-cool)"/>

    <rect x="746" y="362" width="260" height="118" rx="14" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="876" y="397" text-anchor="middle" fill="#ccfbf1" font-size="20" font-weight="800">片上状态</text>
    <text x="876" y="426" text-anchor="middle" fill="#99f6e4" font-size="16">m, l, acc</text>
    <text x="876" y="452" text-anchor="middle" fill="#5eead4" font-size="13">registers / SRAM, 不写 S/P</text>
    <path d="M968 318C1018 350 1019 404 1008 420" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-cool)"/>
    <path d="M806 300C760 330 748 374 754 402" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-cool)"/>

    <rect x="812" y="522" width="150" height="70" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="887" y="552" text-anchor="middle" fill="#d1fae5" font-size="18" font-weight="800">O block</text>
    <text x="887" y="575" text-anchor="middle" fill="#6ee7b7" font-size="13">只写一次 HBM</text>
    <path d="M876 483V516" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-cool)"/>

    <rect x="680" y="596" width="420" height="1" fill="#2dd4bf" opacity="0.45"/>
    <text x="890" y="628" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">收益: 不 materialize N x N, HBM 写回变为 O(Nd)</text>
  </g>
</svg>
