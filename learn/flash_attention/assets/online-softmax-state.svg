<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Online Softmax 的分块状态合并</title>
  <desc id="desc">展示旧 block 状态和新 block 状态如何通过共同的新最大值重标定, 合并成精确的 m 和 l.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1120" height="560" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">Online Softmax: 不回看旧数据也能得到精确分母</text>
  <text x="560" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">关键是把旧分母和新 block 分母都换算到同一个 m_new 坐标系</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="70" y="136" width="270" height="150" rx="16" fill="#111827" stroke="#60a5fa"/>
    <text x="205" y="174" text-anchor="middle" fill="#bfdbfe" font-size="20" font-weight="800">旧状态</text>
    <text x="205" y="210" text-anchor="middle" fill="#dbeafe" font-size="17">m_old = 7</text>
    <text x="205" y="242" text-anchor="middle" fill="#dbeafe" font-size="17">l_old = Σ exp(x_old - 7)</text>
    <text x="205" y="268" text-anchor="middle" fill="#93c5fd" font-size="13">已经扫描过的 blocks</text>

    <rect x="70" y="332" width="270" height="150" rx="16" fill="#111827" stroke="#f59e0b"/>
    <text x="205" y="370" text-anchor="middle" fill="#fde68a" font-size="20" font-weight="800">新 block</text>
    <text x="205" y="406" text-anchor="middle" fill="#fef3c7" font-size="17">m_block = 9</text>
    <text x="205" y="438" text-anchor="middle" fill="#fef3c7" font-size="17">l_block = Σ exp(x_block - 9)</text>
    <text x="205" y="464" text-anchor="middle" fill="#fcd34d" font-size="13">刚读入 SRAM 的 tile</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <path d="M348 211H482" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M348 407H482" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="500" y="172" width="230" height="96" rx="14" fill="#082f49" stroke="#38bdf8"/>
    <text x="615" y="208" text-anchor="middle" fill="#e0f2fe" font-size="19" font-weight="800">统一最大值</text>
    <text x="615" y="240" text-anchor="middle" fill="#bae6fd" font-size="18">m_new = max(7, 9) = 9</text>

    <rect x="500" y="344" width="230" height="96" rx="14" fill="#082f49" stroke="#38bdf8"/>
    <text x="615" y="379" text-anchor="middle" fill="#e0f2fe" font-size="19" font-weight="800">重标定再相加</text>
    <text x="615" y="411" text-anchor="middle" fill="#bae6fd" font-size="16">旧项乘 exp(7 - 9)</text>

    <path d="M734 220C802 238 818 306 842 336" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M734 394H842" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="842" y="246" width="220" height="154" rx="16" fill="#042f2e" stroke="#34d399"/>
    <text x="952" y="286" text-anchor="middle" fill="#d1fae5" font-size="20" font-weight="800">合并后状态</text>
    <text x="952" y="321" text-anchor="middle" fill="#a7f3d0" font-size="18">m_new = 9</text>
    <text x="952" y="354" text-anchor="middle" fill="#a7f3d0" font-size="17">l_new = e^(7-9) l_old</text>
    <text x="952" y="378" text-anchor="middle" fill="#a7f3d0" font-size="17">+ e^(9-9) l_block</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="94" y="506" width="932" height="1" fill="#475569"/>
    <text x="560" y="532" text-anchor="middle" fill="#cbd5e1" font-size="14">在 FlashAttention 中, 同样的 m,l 合并会同步重标定 acc, 所以可以边扫 K,V 边累加 P @ V.</text>
  </g>
</svg>
