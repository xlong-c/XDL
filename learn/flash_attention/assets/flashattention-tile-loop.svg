<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention v1 的 Q block 与 K,V block 扫描</title>
  <desc id="desc">展示一个 Q block 依次扫描所有 K,V block, 在片上维护 m,l,acc 状态, 最后写出 O block.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">FlashAttention v1: 一个 Q block 扫描完整 K,V 序列</text>
  <text x="600" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">scores tile 用完即丢, 跨 tile 保留的是 row-wise m,l,acc</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="76" y="156" width="180" height="220" rx="18" fill="#172554" stroke="#60a5fa"/>
    <text x="166" y="196" text-anchor="middle" fill="#dbeafe" font-size="21" font-weight="800">Q block</text>
    <text x="166" y="222" text-anchor="middle" fill="#93c5fd" font-size="14">BLOCK_M x d</text>
    <g transform="translate(118 250)" fill="#60a5fa" opacity="0.85">
      <rect x="0" y="0" width="20" height="20" rx="3"/>
      <rect x="25" y="0" width="20" height="20" rx="3"/>
      <rect x="50" y="0" width="20" height="20" rx="3"/>
      <rect x="75" y="0" width="20" height="20" rx="3"/>
      <rect x="0" y="26" width="20" height="20" rx="3"/>
      <rect x="25" y="26" width="20" height="20" rx="3"/>
      <rect x="50" y="26" width="20" height="20" rx="3"/>
      <rect x="75" y="26" width="20" height="20" rx="3"/>
    </g>

    <rect x="330" y="132" width="430" height="276" rx="18" fill="#082f49" stroke="#22d3ee"/>
    <text x="545" y="172" text-anchor="middle" fill="#cffafe" font-size="21" font-weight="800">Loop over all K,V blocks</text>
    <text x="545" y="198" text-anchor="middle" fill="#67e8f9" font-size="14">每个 query row 仍然看见所有可见 key</text>
    <g transform="translate(380 238)">
      <rect x="0" y="0" width="72" height="74" rx="10" fill="#155e75" stroke="#22d3ee"/>
      <rect x="88" y="0" width="72" height="74" rx="10" fill="#155e75" stroke="#22d3ee"/>
      <rect x="176" y="0" width="72" height="74" rx="10" fill="#155e75" stroke="#22d3ee"/>
      <rect x="264" y="0" width="72" height="74" rx="10" fill="#155e75" stroke="#22d3ee"/>
      <text x="36" y="32" text-anchor="middle" fill="#ecfeff" font-size="15" font-weight="800">KV0</text>
      <text x="124" y="32" text-anchor="middle" fill="#ecfeff" font-size="15" font-weight="800">KV1</text>
      <text x="212" y="32" text-anchor="middle" fill="#ecfeff" font-size="15" font-weight="800">KV2</text>
      <text x="300" y="32" text-anchor="middle" fill="#ecfeff" font-size="15" font-weight="800">KV3</text>
      <text x="36" y="54" text-anchor="middle" fill="#a5f3fc" font-size="12">tile</text>
      <text x="124" y="54" text-anchor="middle" fill="#a5f3fc" font-size="12">tile</text>
      <text x="212" y="54" text-anchor="middle" fill="#a5f3fc" font-size="12">tile</text>
      <text x="300" y="54" text-anchor="middle" fill="#a5f3fc" font-size="12">tile</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" stroke="#2dd4bf" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M264 264H322"/>
    <path d="M762 270H838"/>
    <path d="M968 362V438"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="840" y="170" width="236" height="190" rx="18" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="958" y="210" text-anchor="middle" fill="#ccfbf1" font-size="21" font-weight="800">On-chip state</text>
    <text x="958" y="246" text-anchor="middle" fill="#a7f3d0" font-size="17">m: [BLOCK_M]</text>
    <text x="958" y="278" text-anchor="middle" fill="#a7f3d0" font-size="17">l: [BLOCK_M]</text>
    <text x="958" y="310" text-anchor="middle" fill="#a7f3d0" font-size="17">acc: [BLOCK_M,d]</text>
    <text x="958" y="336" text-anchor="middle" fill="#5eead4" font-size="12">registers / SRAM</text>

    <rect x="844" y="440" width="230" height="90" rx="18" fill="#064e3b" stroke="#34d399"/>
    <text x="959" y="478" text-anchor="middle" fill="#d1fae5" font-size="21" font-weight="800">O block</text>
    <text x="959" y="506" text-anchor="middle" fill="#6ee7b7" font-size="14">acc / l, write once</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="190" y="494" width="486" height="62" rx="12" fill="#111827" stroke="#475569"/>
    <text x="433" y="520" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="800">不会写出完整 S 或 P</text>
    <text x="433" y="542" text-anchor="middle" fill="#94a3b8" font-size="13">scores_tile 只参与本轮 m,l,acc 更新, 随后释放</text>
  </g>
</svg>
