<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention-2 的 launch grid 与 work partitioning</title>
  <desc id="desc">展示 grid.x 对应 Q blocks, grid.y 对应 batch 乘 heads, 每个 program 拥有一个 Q block 并扫描 K,V blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
  </defs>
  <rect width="1120" height="600" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">FA2: 用 work partitioning 提高硬件利用率</text>
  <text x="560" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">教学版主线: grid.x 是 Q block, grid.y 是 batch x heads, program 内扫描 K,V</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="116" y="134" width="704" height="326" rx="18" fill="#111827" stroke="#334155"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="468" y="172" text-anchor="middle" fill="#bfdbfe" font-size="19" font-weight="800">Launch grid</text>
    <text x="468" y="438" text-anchor="middle" fill="#93c5fd" font-size="14">grid.x = Q blocks along sequence</text>
    <text x="82" y="300" text-anchor="middle" fill="#c4b5fd" font-size="14" transform="rotate(-90 82 300)">grid.y = batch x heads</text>
    <g transform="translate(178 206)">
      <rect x="0" y="0" width="120" height="82" rx="10" fill="#172554" stroke="#60a5fa"/>
      <rect x="140" y="0" width="120" height="82" rx="10" fill="#172554" stroke="#60a5fa"/>
      <rect x="280" y="0" width="120" height="82" rx="10" fill="#172554" stroke="#60a5fa"/>
      <rect x="420" y="0" width="120" height="82" rx="10" fill="#172554" stroke="#60a5fa"/>
      <rect x="0" y="108" width="120" height="82" rx="10" fill="#1e1b4b" stroke="#a78bfa"/>
      <rect x="140" y="108" width="120" height="82" rx="10" fill="#1e1b4b" stroke="#a78bfa"/>
      <rect x="280" y="108" width="120" height="82" rx="10" fill="#1e1b4b" stroke="#a78bfa"/>
      <rect x="420" y="108" width="120" height="82" rx="10" fill="#1e1b4b" stroke="#a78bfa"/>
      <text x="60" y="31" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">Q block 0</text>
      <text x="200" y="31" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">Q block 1</text>
      <text x="340" y="31" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">Q block 2</text>
      <text x="480" y="31" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">Q block 3</text>
      <text x="60" y="139" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">Q block 0</text>
      <text x="200" y="139" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">Q block 1</text>
      <text x="340" y="139" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">Q block 2</text>
      <text x="480" y="139" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">Q block 3</text>
      <text x="60" y="56" text-anchor="middle" fill="#93c5fd" font-size="11">scan K,V</text>
      <text x="200" y="56" text-anchor="middle" fill="#93c5fd" font-size="11">scan K,V</text>
      <text x="340" y="56" text-anchor="middle" fill="#93c5fd" font-size="11">scan K,V</text>
      <text x="480" y="56" text-anchor="middle" fill="#93c5fd" font-size="11">scan K,V</text>
      <text x="60" y="164" text-anchor="middle" fill="#c4b5fd" font-size="11">scan K,V</text>
      <text x="200" y="164" text-anchor="middle" fill="#c4b5fd" font-size="11">scan K,V</text>
      <text x="340" y="164" text-anchor="middle" fill="#c4b5fd" font-size="11">scan K,V</text>
      <text x="480" y="164" text-anchor="middle" fill="#c4b5fd" font-size="11">scan K,V</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="860" y="138" width="198" height="322" rx="18" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="959" y="178" text-anchor="middle" fill="#ccfbf1" font-size="19" font-weight="800">FA2 关注点</text>
    <rect x="884" y="212" width="150" height="54" rx="10" fill="#064e3b" stroke="#34d399"/>
    <text x="959" y="245" text-anchor="middle" fill="#d1fae5" font-size="14" font-weight="800">减少 non-matmul</text>
    <rect x="884" y="286" width="150" height="54" rx="10" fill="#082f49" stroke="#38bdf8"/>
    <text x="959" y="319" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="800">增加并行度</text>
    <rect x="884" y="360" width="150" height="54" rx="10" fill="#312e81" stroke="#a78bfa"/>
    <text x="959" y="393" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="800">改善 warp 分工</text>
  </g>

  <text x="560" y="532" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="14">本教程的 FA2 图只表达 forward kernel 主干, 不声称覆盖 backward, dropout, varlen, FP8 或硬件特化.</text>
</svg>
