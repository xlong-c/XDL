<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Triton Fused Softmax 的单行 program</title>
  <desc id="desc">展示一个 Triton program 读取一行, 在同一个 kernel 内完成 max, exp, sum, divide, store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1120" height="560" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">Triton Fused Softmax: 一个 program 处理一行</text>
  <text x="560" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">load, max, exp, sum, divide, store 都在一个 kernel 内完成</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="88" y="144" width="944" height="272" rx="18" fill="#111827" stroke="#334155"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="164" y="198" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="800">input row</text>
    <g transform="translate(78 220)">
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#1d4ed8"/>
      <rect x="40" y="0" width="34" height="34" rx="6" fill="#2563eb"/>
      <rect x="80" y="0" width="34" height="34" rx="6" fill="#0ea5e9"/>
      <rect x="120" y="0" width="34" height="34" rx="6" fill="#38bdf8"/>
      <rect x="160" y="0" width="34" height="34" rx="6" fill="#7dd3fc"/>
      <rect x="200" y="0" width="34" height="34" rx="6" fill="#334155" stroke="#64748b" stroke-dasharray="4 4"/>
      <text x="217" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">mask</text>
    </g>

    <path d="M310 237H374" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="384" y="190" width="110" height="94" rx="12" fill="#082f49" stroke="#38bdf8"/>
    <text x="439" y="228" text-anchor="middle" fill="#e0f2fe" font-size="18" font-weight="800">tl.max</text>
    <text x="439" y="254" text-anchor="middle" fill="#bae6fd" font-size="13">row max</text>

    <path d="M500 237H564" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="574" y="190" width="110" height="94" rx="12" fill="#312e81" stroke="#a78bfa"/>
    <text x="629" y="228" text-anchor="middle" fill="#ede9fe" font-size="18" font-weight="800">tl.exp</text>
    <text x="629" y="254" text-anchor="middle" fill="#c4b5fd" font-size="13">x - max</text>

    <path d="M690 237H754" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="764" y="190" width="110" height="94" rx="12" fill="#78350f" stroke="#f59e0b"/>
    <text x="819" y="228" text-anchor="middle" fill="#fef3c7" font-size="18" font-weight="800">tl.sum</text>
    <text x="819" y="254" text-anchor="middle" fill="#fde68a" font-size="13">denom</text>

    <path d="M880 237H944" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="954" y="190" width="94" height="94" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="1001" y="228" text-anchor="middle" fill="#d1fae5" font-size="18" font-weight="800">store</text>
    <text x="1001" y="254" text-anchor="middle" fill="#6ee7b7" font-size="13">probs</text>

    <rect x="346" y="332" width="428" height="46" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="560" y="361" text-anchor="middle" fill="#cbd5e1" font-size="14">中间结果留在寄存器/片上, 不拆成多个 PyTorch op 往返 HBM</text>
  </g>

  <text x="560" y="500" text-anchor="middle" fill="#5eead4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">FlashAttention 把这个 row softmax 思路扩展到 QK tile + online update + PV tile.</text>
</svg>
