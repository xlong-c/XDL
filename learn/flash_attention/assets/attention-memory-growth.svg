<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Attention 中间矩阵显存随序列长度增长</title>
  <desc id="desc">柱状图展示 batch 等于 1, heads 等于 32, fp16 时 S 和 P 两个 N x N 矩阵的显存开销随序列长度平方增长.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="52%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1120" height="560" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800">为什么 N x N 不能随便 materialize</text>
  <text x="560" y="84" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">S + P, batch=1, heads=32, fp16: 128 x N^2 bytes</text>

  <g font-family="Inter, Arial, sans-serif">
    <line x1="110" y1="430" x2="1010" y2="430" stroke="#64748b" stroke-width="2"/>
    <line x1="110" y1="128" x2="110" y2="430" stroke="#64748b" stroke-width="2"/>
    <text x="88" y="136" text-anchor="end" fill="#94a3b8" font-size="13">128 GiB</text>
    <text x="88" y="232" text-anchor="end" fill="#94a3b8" font-size="13">8 GiB</text>
    <text x="88" y="326" text-anchor="end" fill="#94a3b8" font-size="13">512 MiB</text>
    <text x="88" y="430" text-anchor="end" fill="#94a3b8" font-size="13">0</text>
    <g stroke="#334155" stroke-dasharray="5 7">
      <line x1="110" y1="136" x2="1010" y2="136"/>
      <line x1="110" y1="232" x2="1010" y2="232"/>
      <line x1="110" y1="326" x2="1010" y2="326"/>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(180 0)">
      <rect x="0" y="397" width="92" height="33" rx="8" fill="url(#bar)"/>
      <text x="46" y="386" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="800">128 MiB</text>
      <text x="46" y="462" text-anchor="middle" fill="#e5e7eb" font-size="15">1,024</text>
    </g>
    <g transform="translate(340 0)">
      <rect x="0" y="358" width="92" height="72" rx="8" fill="url(#bar)"/>
      <text x="46" y="347" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="800">512 MiB</text>
      <text x="46" y="462" text-anchor="middle" fill="#e5e7eb" font-size="15">2,048</text>
    </g>
    <g transform="translate(500 0)">
      <rect x="0" y="300" width="92" height="130" rx="8" fill="url(#bar)"/>
      <text x="46" y="289" text-anchor="middle" fill="#fed7aa" font-size="14" font-weight="800">2 GiB</text>
      <text x="46" y="462" text-anchor="middle" fill="#e5e7eb" font-size="15">4,096</text>
    </g>
    <g transform="translate(660 0)">
      <rect x="0" y="224" width="92" height="206" rx="8" fill="url(#bar)"/>
      <text x="46" y="213" text-anchor="middle" fill="#fecdd3" font-size="14" font-weight="800">8 GiB</text>
      <text x="46" y="462" text-anchor="middle" fill="#e5e7eb" font-size="15">8,192</text>
    </g>
    <g transform="translate(820 0)">
      <rect x="0" y="126" width="92" height="304" rx="8" fill="url(#bar)"/>
      <text x="46" y="115" text-anchor="middle" fill="#fecdd3" font-size="14" font-weight="800">128 GiB</text>
      <text x="46" y="462" text-anchor="middle" fill="#e5e7eb" font-size="15">32,768</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="560" y="500" text-anchor="middle" fill="#cbd5e1" font-size="15">横轴: seq_len N. 纵轴: 仅 S 和 P 的 HBM 占用, 不含 Q/K/V/O/backward.</text>
    <rect x="206" y="520" width="708" height="1" fill="#475569"/>
    <text x="560" y="544" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">FlashAttention 的目标: 不把 S/P 写出, 用 block 内 m,l,acc 直接得到 O.</text>
  </g>
</svg>
