<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RNN 压缩记忆, 注意力全量记忆, GDN 可读写可遗忘记忆三种方案对比">
  <rect width="1200" height="600" rx="28" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1128" height="544" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <text x="600" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">
    三种处理"历史"的思路
  </text>

  <!-- Panel 1: RNN -->
  <rect x="72" y="116" width="344" height="424" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="244" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">RNN · 压缩记忆</text>

  <rect x="143" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="197" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="251" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="305" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="244" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7C2D12">逐个 token 进来</text>

  <path d="M244 268 L244 300" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M234 290 L244 302 L254 290" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="194" y="306" width="100" height="72" rx="14" fill="#C7D2FE" stroke="#6366F1" stroke-width="2"/>
  <text x="244" y="338" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E1B4B">hₜ</text>
  <text x="244" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#312E81">单个向量</text>

  <text x="244" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">全部历史压进一个向量</text>
  <text x="244" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">省内存, 但序列一长就容易忘</text>

  <!-- Panel 2: Attention -->
  <rect x="446" y="116" width="344" height="424" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="618" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">注意力 · 全量记忆</text>

  <rect x="517" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="571" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="625" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="679" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="618" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7C2D12">逐个 token 进来</text>

  <path d="M618 268 L618 300" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M608 290 L618 302 L628 290" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="497" y="306" width="44" height="72" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="549" y="306" width="44" height="72" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="601" y="306" width="44" height="72" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="653" y="306" width="44" height="72" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="705" y="306" width="44" height="72" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="727" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#7C3AED">…</text>

  <text x="618" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">每个 token 都原样留着</text>
  <text x="618" y="464" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">不会忘, 但长度翻倍开销翻四倍</text>

  <!-- Panel 3: GDN -->
  <rect x="820" y="116" width="344" height="424" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="992" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">GDN · 会读写的记忆</text>

  <rect x="891" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="945" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="999" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="1053" y="190" width="40" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="992" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7C2D12">逐个 token 进来</text>

  <path d="M992 268 L992 296" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M982 286 L992 298 L1002 286" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="932" y="302" width="120" height="90" rx="14" fill="#C7D2FE" stroke="#6366F1" stroke-width="2"/>
  <line x1="972" y1="302" x2="972" y2="392" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
  <line x1="1012" y1="302" x2="1012" y2="392" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
  <line x1="932" y1="332" x2="1052" y2="332" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
  <line x1="932" y1="362" x2="1052" y2="362" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
  <text x="992" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">Sₜ 记忆矩阵</text>

  <text x="992" y="466" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">固定大小, 但能定向写入和遗忘</text>

  <text x="600" y="528" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">
    GDN 走第三条路: 用一块固定大小的记忆, 换来"既能记牢, 又不爆开销"
  </text>
</svg>
