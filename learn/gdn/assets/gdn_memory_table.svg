<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="把记忆矩阵 S 理解成一张 key 到 value 的关联表, 写入是外积, 读取是用 key 做点积">
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1128" height="584" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <text x="600" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">
    记忆矩阵 S 就是一张"线索 → 内容"的关联表
  </text>

  <!-- WRITE side -->
  <rect x="72" y="120" width="516" height="430" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="330" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">写入 · S += k ⊗ v</text>

  <!-- k vector -->
  <text x="150" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7C2D12">线索 k</text>
  <rect x="120" y="232" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="120" y="276" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="120" y="320" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>

  <text x="200" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#334155">⊗</text>

  <!-- v vector (row) -->
  <text x="360" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7F1D1D">内容 v</text>
  <rect x="252" y="232" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <rect x="300" y="232" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <rect x="348" y="232" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <rect x="396" y="232" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>

  <text x="464" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#334155">=</text>

  <!-- resulting matrix -->
  <rect x="252" y="296" width="240" height="200" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <line x1="312" y1="296" x2="312" y2="496" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="372" y1="296" x2="372" y2="496" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="432" y1="296" x2="432" y2="496" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="252" y1="362" x2="492" y2="362" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="252" y1="429" x2="492" y2="429" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <text x="372" y="528" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E1B4B">S 矩阵 [Dk × Dv]</text>

  <text x="330" y="566" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">把"这条线索对应这段内容"刻进矩阵</text>

  <!-- READ side -->
  <rect x="612" y="120" width="516" height="430" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="870" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">读取 · read = Sᵀ k</text>

  <!-- query key -->
  <text x="690" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7C2D12">线索 k</text>
  <rect x="660" y="232" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="660" y="276" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="660" y="320" width="44" height="40" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>

  <!-- matrix -->
  <rect x="744" y="232" width="200" height="170" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <line x1="794" y1="232" x2="794" y2="402" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="844" y1="232" x2="844" y2="402" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="894" y1="232" x2="894" y2="402" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="744" y1="289" x2="944" y2="289" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <line x1="744" y1="346" x2="944" y2="346" stroke="#6366F1" stroke-width="1.5" opacity="0.45"/>
  <text x="844" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1E1B4B">S 记忆矩阵</text>

  <path d="M724 350 L744 350" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M960 320 L984 320" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M974 310 L986 320 L974 330" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- output -->
  <text x="1042" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7F1D1D">读出 read</text>
  <rect x="1000" y="280" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <rect x="1044" y="280" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <rect x="1088" y="280" width="44" height="40" rx="8" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>

  <text x="870" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">拿线索去查表, 取回当初写进去的内容</text>
  <text x="870" y="518" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">线索越接近, 读出的内容越接近原值</text>

  <text x="600" y="592" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">
    写入用外积把一对 (k, v) 叠进矩阵, 读取用点积按线索取回内容 — 这就是线性记忆的全部直觉
  </text>
</svg>
