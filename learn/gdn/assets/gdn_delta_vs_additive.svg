<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="additive 记忆与 delta rule 对比图">
  <rect width="1200" height="640" rx="28" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1128" height="576" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <text x="600" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#0F172A">
    两种写记忆的方式: 硬塞 vs 先读再纠错
  </text>

  <!-- divider -->
  <path d="M600 116V566" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ===== Left: additive ===== -->
  <text x="318" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#B45309">
    Additive: 直接累加
  </text>
  <text x="318" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#92400E">
    S ← S + k ⊗ v
  </text>

  <!-- old memory -->
  <rect x="120" y="214" width="150" height="92" rx="14" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="195" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3730A3">旧记忆 S</text>
  <text x="195" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4338CA">已经记得一些东西</text>

  <!-- new value -->
  <rect x="120" y="338" width="150" height="80" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="195" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E">新内容 k ⊗ v</text>
  <text x="195" y="396" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">不管旧的, 整份塞进去</text>

  <!-- plus -->
  <circle cx="370" cy="316" r="26" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
  <text x="370" y="316" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#92400E">+</text>
  <path d="M270 260H344" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M270 378H344" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- result -->
  <rect x="420" y="270" width="138" height="92" rx="14" fill="#FECACA" stroke="#EF4444" stroke-width="2"/>
  <text x="489" y="306" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#991B1B">越堆越多</text>
  <text x="489" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" fill="#B91C1C">重复信息也照单全收</text>
  <path d="M396 316H420" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M408 306L420 316L408 326" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="318" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748B">
    问题: 即使旧记忆已经会答,
  </text>
  <text x="318" y="494" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748B">
    也会再写一份, 容易互相干扰
  </text>

  <!-- ===== Right: delta ===== -->
  <text x="882" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0E7490">
    Delta Rule: 先读再纠错
  </text>
  <text x="882" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#155E75">
    S ← S + k ⊗ β(v − read)
  </text>

  <!-- step 1 read -->
  <rect x="650" y="208" width="180" height="64" rx="14" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="740" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730A3">① 用 k 读旧记忆</text>
  <text x="740" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4338CA">read = Sᵀk</text>

  <!-- step 2 compare -->
  <rect x="650" y="292" width="180" height="64" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="740" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E">② 比对目标 v</text>
  <text x="740" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#B45309">误差 = v − read</text>

  <!-- step 3 write -->
  <rect x="650" y="376" width="180" height="64" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="740" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D">③ 只写误差</text>
  <text x="740" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">写入 β · 误差</text>

  <path d="M740 272V292" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730 282L740 292L750 282" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M740 356V376" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730 366L740 376L750 366" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- result memory -->
  <rect x="884" y="292" width="174" height="64" rx="14" fill="#CFFAFE" stroke="#06B6D4" stroke-width="2"/>
  <text x="971" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#155E75">更新后的 S</text>
  <text x="971" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" fill="#0E7490">只补还没记住的部分</text>
  <path d="M830 324H884" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M872 314L884 324L872 334" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="882" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748B">
    好处: 旧记忆已经会答时误差≈0, 几乎不写;
  </text>
  <text x="882" y="502" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748B">
    答错越多写得越多, 像在线纠错
  </text>

  <text x="600" y="556" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">
    β 控制每次纠错的力度: 越接近 1 越相信当前误差, 越接近 0 越保守
  </text>
</svg>
