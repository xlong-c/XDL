# 示范配置文件：使用YAML初始化CoreComponent和DataComponent

# CoreComponent配置
core_component:
  name: "demo_core"
  model:
    backbone:
      name: "resnet50"
      from_library: "torchvision"
      params:
        pretrained: true
    head:
      name: "Linear"
      from_library: "torch"
      params:
        in_features: 2048
        out_features: 10

  optimizer:
    backbone_opt:
      model: ["backbone"]
      name: "Adam"
      from_library: "torch"
      params:
        lr: 0.001
        weight_decay: 0.0001
    head_opt:
      model: ["head"]
      name: "SGD"
      from_library: "torch"
      params:
        lr: 0.01
        momentum: 0.9

  scheduler:
    backbone_scheduler:
      optimizer: "backbone_opt"
      name: "StepLR"
      from_library: "torch"
      params:
        step_size: 30
        gamma: 0.1
    head_scheduler:
      optimizer: "head_opt"
      name: "CosineAnnealingLR"
      from_library: "torch"
      params:
        T_max: 100

  loss:
    - name: "CrossEntropyLoss"
      weight: 1.0
      from_library: "torch"
      params: {}
    - name: "MSELoss"
      weight: 0.5
      from_library: "torch"
      params: {}

  # 评估指标配置
  metric:
    - name: "Accuracy"
      from_library: "local"
      params: {}
    - name: "Precision"
      from_library: "local"
      params:
        num_classes: 10
    - name: "Recall"
      from_library: "local"
      params:
        num_classes: 10
    - name: "F1Score"
      from_library: "local"
      params:
        num_classes: 10
    - name: "TopKAccuracy"
      from_library: "local"
      params:
        k: 5

# DataComponent配置
data_component:
  name: "demo_data"
  dataset:
    train:
      name: "CIFAR10"
      from_library: "torchvision"
      params:
        root: "./data"
        train: true
        download: true
    val:
      name: "CIFAR10"
      from_library: "torchvision"
      params:
        root: "./data"
        train: false
        download: true
    test:
      name: "CIFAR10"
      from_library: "torchvision"
      params:
        root: "./data"
        train: false
        download: true

  dataloader:
    train:
      batch_size: 32
      shuffle: true
      num_workers: 4
    val:
      batch_size: 32
      shuffle: false
      num_workers: 4
    test:
      batch_size: 32
      shuffle: false
      num_workers: 4

  transforms:
    train:
      - name: "RandomCrop"
        from_library: "torchvision"
        params:
          size: 32
          padding: 4
      - name: "RandomHorizontalFlip"
        from_library: "torchvision"
        params: {}
      - name: "ToTensor"
        from_library: "torchvision"
        params: {}
      - name: "Normalize"
        from_library: "torchvision"
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    val:
      - name: "ToTensor"
        from_library: "torchvision"
        params: {}
      - name: "Normalize"
        from_library: "torchvision"
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    test:
      - name: "ToTensor"
        from_library: "torchvision"
        params: {}
      - name: "Normalize"
        from_library: "torchvision"
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
