# 使用示例:
# XDL_FLUX2_KLEIN_CONFIG=examples/flux2_klein_9b_outfit_lora.yaml \
#   python examples/flux2_klein_9b_lora_finetune.py

model_id: black-forest-labs/FLUX.2-klein-base-9B
train_manifest: ./data/flux2_klein_outfit/train.jsonl
val_manifest: null
output_dir: ./outputs/flux2_klein_9b_outfit_lora

# 所有训练图共享任务触发词, 不描述任一样本的具体服装. 脚本会在训练开始前预编码一次并缓存.
training_prompt: outfit swap

image_height: 1536
image_width: 864
batch_size: 1
num_workers: 4
dataset_repeat: 10
num_epochs: 100
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 1.0e-2
max_grad_norm: 1.0
device: cuda
model_dtype: auto

max_sequence_length: 256
text_encoder_out_layers: [9, 18, 27]
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
enable_gradient_checkpointing: true

weighting_scheme: none
logit_mean: 0.0
logit_std: 1.0
mode_scale: 1.29
save_every_n_epochs: 10
sample_every_n_epochs: 10
sample_steps: 20
sample_guidance: 4.0
sample_prompts:
  - outfit swap
seed: 42
