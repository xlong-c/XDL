# 统一日志系统配置示例（schema v1）

config_version: 1

runtime:
  device: "cpu"
  experiment_name: "unified_logger_example"
  output_dir: "./others"

trainer:
  max_epochs: 10
  batch_size: 32
  gradient_accumulation_steps: 1

model:
  type: "simple_mlp"
  source: "registry"
  params:
    input_size: 784
    hidden_size: 128
    num_classes: 10
    dropout_rate: 0.2

data:
  datasets:
    train:
      type: "SyntheticClassificationDataset"
      source: "registry"
      params:
        num_samples: 500
        input_shape: [784]
        num_classes: 10
        seed: 42

    val:
      type: "SyntheticClassificationDataset"
      source: "registry"
      params:
        num_samples: 100
        input_shape: [784]
        num_classes: 10
        seed: 43

  dataloaders:
    train:
      dataset: ${data.datasets.train}
      params:
        batch_size: 32
        shuffle: true
        num_workers: 0
        pin_memory: false
        drop_last: true

    val:
      dataset: ${data.datasets.val}
      params:
        batch_size: 32
        shuffle: false
        num_workers: 0
        pin_memory: false
        drop_last: false

optimization:
  optimizer:
    type: "Adam"
    source: "torch.optim"
    params:
      lr: 0.001
      weight_decay: 0.0001

  scheduler:
    type: "StepLR"
    source: "torch.optim.lr_scheduler"
    params:
      step_size: 30
      gamma: 0.1

loss:
  - type: "CrossEntropyLoss"
    source: "torch.nn"
    params: {}

metrics:
  - type: "Accuracy"
    source: "registry"
    params:
      num_classes: 10

logging:
  log_dir: "./others/logs"
  enable_console: true
  enable_tensorboard: true
  enable_wandb: false

checkpoint:
  dirpath: "./others"
  save_last: true
  save_top_k: 3
  monitor: "val_accuracy"
  mode: "max"
  every_n_epochs: 1
