# 摄像头参数参考文档（实际配置在 tools/camera_setup.sh 中）
# 运行: bash tools/camera_setup.sh

device: /dev/video0

controls:
  # === User Controls ===
  brightness:                32    # 1-64, 默认 32
  contrast:                  32    # 1-64, 默认 32
  saturation:                32    # 1-64, 默认 32
  hue:                       32    # 1-64, 默认 32
  white_balance_automatic:   true  # bool, 默认 true
  gamma:                     30    # 0-64, 默认 32
  gain:                      0     # 0-15, 默认 0
  power_line_frequency:      1     # 0=Disabled, 1=50 Hz, 2=60 Hz, 默认 1
  white_balance_temperature: 5000  # 1800-10000, 默认 5000
  sharpness:                 32    # 1-64, 默认 32
  backlight_compensation:    1     # 0-3, 默认 1

  # === Camera Controls ===
  auto_exposure:             1     # 0=Auto, 1=Manual, 2=Shutter Priority, 3=Aperture Priority, 默认 3
  exposure_time_absolute:    280   # 1-5000, 默认 100
  pan_absolute:              0     # -576000..576000, step 3600, 默认 0
  tilt_absolute:             0     # -576000..576000, step 3600, 默认 0
  focus_absolute:            512   # 0-1023, 默认 512 (需关闭自动对焦才生效)
  focus_automatic_continuous: true # bool, 默认 true
  zoom_absolute:             0     # 0-100, 默认 0
