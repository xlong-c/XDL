# VGGNet 在 CIFAR100 上的训练配置（schema v1）

config_version: 1

runtime:
  device: "cuda"
  experiment_name: "vgg16_cifar100"
  output_dir: "./others"

trainer:
  max_epochs: 100
  batch_size: 128
  gradient_accumulation_steps: 1
  grad_clip_max_norm: 5.0

model:
  type: "vgg16_bn"
  source: "registry"
  params:
    num_classes: 100
    dropout: 0.5

data:
  transforms:
    train:
      type: "compose"
      items:
        - type: "Resize"
          source: "torchvision.transforms"
          params:
            size: [224, 224]
        - type: "RandomHorizontalFlip"
          source: "torchvision.transforms"
          params:
            p: 0.5
        - type: "RandomRotation"
          source: "torchvision.transforms"
          params:
            degrees: 10
        - type: "ToTensor"
          source: "torchvision.transforms"
          params: {}
        - type: "Normalize"
          source: "torchvision.transforms"
          params:
            mean: [0.5071, 0.4867, 0.4408]
            std: [0.2675, 0.2565, 0.2761]

    val:
      type: "compose"
      items:
        - type: "Resize"
          source: "torchvision.transforms"
          params:
            size: [224, 224]
        - type: "ToTensor"
          source: "torchvision.transforms"
          params: {}
        - type: "Normalize"
          source: "torchvision.transforms"
          params:
            mean: [0.5071, 0.4867, 0.4408]
            std: [0.2675, 0.2565, 0.2761]

  datasets:
    train:
      type: "CIFAR100"
      source: "torchvision.datasets"
      params:
        root: "./data"
        train: true
        download: true
      transform: ${data.transforms.train}

    val:
      type: "CIFAR100"
      source: "torchvision.datasets"
      params:
        root: "./data"
        train: false
        download: true
      transform: ${data.transforms.val}

  dataloaders:
    train:
      dataset: ${data.datasets.train}
      params:
        batch_size: 128
        shuffle: true
        num_workers: 0
        pin_memory: false
        drop_last: true

    val:
      dataset: ${data.datasets.val}
      params:
        batch_size: 128
        shuffle: false
        num_workers: 0
        pin_memory: false
        drop_last: false

optimization:
  optimizer:
    type: "SGD"
    source: "torch.optim"
    params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005

  scheduler:
    type: "MultiStepLR"
    source: "torch.optim.lr_scheduler"
    params:
      milestones: [30, 60, 80]
      gamma: 0.1

loss:
  - type: "CrossEntropyLoss"
    source: "torch.nn"
    weight: 1.0
    params: {}

metrics:
  - type: "Accuracy"
    source: "registry"
    params:
      num_classes: 100

logging:
  log_dir: "./others/logs"
  enable_console: true
  enable_tensorboard: true
  enable_wandb: false

checkpoint:
  dirpath: "./others"
  save_last: true
  save_top_k: 5
  monitor: "Accuracy"
  mode: "max"
  every_n_epochs: 5
