# VGGNet 在 CIFAR100 上的训练配置（schema v1）

config_version: 1

runtime:
  device: "cuda"
  data_dir: "./data"
  experiment_name: "vgg16_cifar100"
  output_dir: "./others"

trainer:
  max_epochs: 100
  batch_size: 128
  gradient_accumulation_steps: 1
  grad_clip_max_norm: 5.0

model:
  target: "registry:vgg16_bn"
  params:
    num_classes: 100
    dropout: 0.5

dataloader_defaults:
  batch_size: ${trainer.batch_size}
  num_workers: 4
  pin_memory: true

train_transforms:
  target: "torchvision.transforms:Compose"
  params:
    transforms:
      - target: "torchvision.transforms:Resize"
        params:
          size: [224, 224]
      - target: "torchvision.transforms:RandomHorizontalFlip"
        params:
          p: 0.5
      - target: "torchvision.transforms:RandomRotation"
        params:
          degrees: 10
      - target: "torchvision.transforms:ToTensor"
        params: {}
      - target: "torchvision.transforms:Normalize"
        params:
          mean: [0.5071, 0.4867, 0.4408]
          std: [0.2675, 0.2565, 0.2761]

val_transforms:
  target: "torchvision.transforms:Compose"
  params:
    transforms:
      - target: "torchvision.transforms:Resize"
        params:
          size: [224, 224]
      - target: "torchvision.transforms:ToTensor"
        params: {}
      - target: "torchvision.transforms:Normalize"
        params:
          mean: [0.5071, 0.4867, 0.4408]
          std: [0.2675, 0.2565, 0.2761]

train_dataset:
  target: "torchvision.datasets:CIFAR100"
  params:
    root: ${runtime.data_dir}
    train: true
    download: true
    transform: ${train_transforms}

val_dataset:
  target: "torchvision.datasets:CIFAR100"
  params:
    root: ${runtime.data_dir}
    train: false
    download: true
    transform: ${val_transforms}

train_dataloader:
  dataset: ${train_dataset}
  params:
    shuffle: true
    drop_last: true

val_dataloader:
  dataset: ${val_dataset}
  params:
    shuffle: false
    drop_last: false

optimization:
  optimizer:
    target: "torch.optim:SGD"
    params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0005

  scheduler:
    target: "torch.optim.lr_scheduler:MultiStepLR"
    params:
      milestones: [30, 60, 80]
      gamma: 0.1

loss:
  - target: "torch.nn:CrossEntropyLoss"
    weight: 1.0
    params: {}

metrics:
  - target: "registry:Accuracy"
    params:
      num_classes: 100

logging:
  log_dir: "./others/logs"
  enable_console: true
  enable_tensorboard: true
  enable_wandb: false

checkpoint:
  dirpath: "./others"
  save_last: true
  save_top_k: 5
  monitor: "Accuracy"
  mode: "max"
  every_n_epochs: 5
