<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GEMM SVG Preview</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #e2e8f0; }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 24px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(15,23,42,.08); padding: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 16px; font-size: 28px; color: #0f172a; }
    h2 { margin: 0 0 12px; font-size: 20px; color: #1e293b; }
    img { width: 100%; height: auto; display: block; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GEMM SVG Preview</h1>
    <div class="card">
      <h2>sgemm_tiling_demo.svg</h2>
      <img src="../../learn/cuda/kernels/gemm/sgemm_tiling_demo.svg" alt="tiling demo" />
    </div>
    <div class="card">
      <h2>sgemm_tiling_levels.svg</h2>
      <img src="../../learn/cuda/kernels/gemm/sgemm_tiling_levels.svg" alt="tiling levels" />
    </div>
  </div>
</body>
</html>
